<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://sfqiweyxxhmligvfuffz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sOsgGVpvZuyURoQYoy4PUw_xsyCmHQY';
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
console.log('Supabase connected');

async function sendEmailNotification(data) {
  try {
    // استخدام FormSubmit لإرسال الإيميل مجاناً
    await fetch('https://formsubmit.co/ajax/ebmovingcleaning@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: `🔔 حجز جديد - ${data.service || 'EB Home Services'} - ${data.name}`,
        _template: 'table',
        _captcha: 'false',
        name: data.name,
        phone: data.phone,
        email: data.email,
        service: data.service,
        address: data.address || data.from_address || '',
        details: JSON.stringify(data, null, 2),
        message: `طلب جديد من الموقع: \nالاسم: ${data.name}\nالهاتف: ${data.phone}\nالخدمة: ${data.service}\nالعنوان: ${data.address || ''}`
      })
    });
    console.log('Email sent attempt');
  } catch(e) { console.log('Email error', e); }
}

async function handleEBBooking(formDataObj) {
  try {
    const name = formDataObj.name || formDataObj.fullName || formDataObj['full-name'] || 'Customer';
    const phone = formDataObj.phone || formDataObj.tel || '';
    const email = formDataObj.email || 'ebmovingcleaning@gmail.com';
    const address = formDataObj.address || formDataObj.from_address || formDataObj['from-address'] || '';
    const service = formDataObj.service || formDataObj.service_type || formDataObj['service-type'] || 'General';

    // 1. حفظ في Supabase
    const { data: customer } = await _supabase.from('customers').insert([{ name, phone, email, address }]).select().single();
    const customer_id = customer?.id || null;

    if ((formDataObj.request_type === 'quote') || (service && service.toLowerCase().includes('quote'))) {
       await _supabase.from('quotes').insert([{ name, phone, email, service, address, details: formDataObj.notes || JSON.stringify(formDataObj) }]);
    } else {
       await _supabase.from('bookings').insert([{ customer_id, service_type: service, booking_date: formDataObj.date || new Date().toISOString().split('T')[0], booking_time: formDataObj.time || '10:00', from_address: address, to_address: formDataObj.to_address || '', notes: JSON.stringify(formDataObj), status: 'pending' }]);
    }

    // 2. إرسال إيميل
    await sendEmailNotification({ name, phone, email, service, address, ...formDataObj });
    return true;
  } catch(e) {
    console.error('Save failed', e);
    // حتى لو فشل الحفظ، نحاول نرسل الإيميل
    try { await sendEmailNotification(formDataObj); } catch(_e) {}
    return true;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('form').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]');
      const orig = btn ? btn.innerText : '';
      if(btn) { btn.innerText = 'جار الإرسال...'; btn.disabled = true; }
      const fd = new FormData(form);
      const obj = Object.fromEntries(fd.entries());
      form.querySelectorAll('input, textarea, select').forEach(el => {
        if(el.id && !obj[el.id] && el.value) obj[el.id] = el.value;
      });
      const ok = await handleEBBooking(obj);
      if(ok) {
        alert('✅ تم استلام طلبك! سنتصل بك قريبا - EB Home Services');
        form.reset();
      }
      if(btn) { btn.innerText = orig; btn.disabled = false; }
    });
  });
});
</script>
</body>
